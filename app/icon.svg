<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" fill="#1B365D" rx="4"/>

  <!-- House roof - white outline -->
  <path
    d="M16 5 L27 14 L27 27 L5 27 L5 14 Z"
    fill="none"
    stroke="white"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Door (white rectangle) -->
  <rect
    x="11"
    y="15"
    width="10"
    height="12"
    fill="white"
    rx="1"
  />

  <!-- D letter as door detail -->
  <text
    x="16"
    y="24.5"
    font-family="Georgia, Times, serif"
    font-size="11"
    font-weight="bold"
    fill="#1B365D"
    text-anchor="middle"
  >D</text>
</svg>
